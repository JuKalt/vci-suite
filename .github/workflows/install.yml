name: Suite install
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out suite and pinned components
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: suite-bootstrap
          python-version: '3.11'
      - run: ./install.sh --cli-only
